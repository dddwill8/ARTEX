name: cloud-binary

# 本机是 Apple Silicon。只在 GitHub Actions 上交叉编译 linux/arm64，
# 产物给本地 Dockerfile 组装运行镜像。不推 Docker Hub（autumn27/artex 已失效）。
on:
  push:
    branches: [ci/cloud-build]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out
          retention-days: 14

  binary:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build linux/arm64
        env:
          ARTEX_BUILD_VERSION: "0.3.15"
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "0"
          ARTEX_OUTPUT: dist/arm64/artex
        run: ./build.sh --target linux/arm64
      - name: Smoke test
        run: file dist/arm64/artex && ls -lh dist/arm64/artex
      - uses: actions/upload-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64/artex
          retention-days: 14
